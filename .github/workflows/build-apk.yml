name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Generate keystore
        run: |
          keytool -genkey -v -keystore android.keystore \
            -alias travelchecklist -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Travel Checklist, OU=Dev, O=Travel, L=Beijing, ST=Beijing, C=CN"

      - name: Build APK with Bubblewrap
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          npx @bubblewrap/cli build --twaManifest twa-manifest.json --skipPrompt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: travel-checklist-apk
          path: app/release/*.apk

      - name: Upload to Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 'Android APK (最新)'
          files: app/release/*.apk
          prerelease: true
          make_latest: true
        continue-on-error: true
